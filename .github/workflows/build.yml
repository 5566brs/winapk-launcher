# Compile check for every push and pull request: builds the launcher (Release, warnings are errors).
# Releases are made by release.yml.
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build the launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build WinApkLauncher.csproj -c Release -warnaserror -p:TreatWarningsAsErrors=true

      # The runtime lock-name mirror (checked against values from the runtime's C++) and the
      # startup log parser. The exe is a GUI app: piping its output makes PowerShell wait for it.
      - name: Self-test
        shell: pwsh
        run: |
          & bin/Release/net10.0-windows/WinApkLauncher.exe --self-test | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "self-test failed ($LASTEXITCODE)" }
